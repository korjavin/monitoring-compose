apiVersion: 1

datasources:
  # -----------------------------------------------------------------
  # 1. VictoriaMetrics (Prometheus-compatible)
  # -----------------------------------------------------------------
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s
    editable: true

  # -----------------------------------------------------------------
  # 2. VictoriaLogs (Official victoriametrics-logs-datasource plugin)
  # -----------------------------------------------------------------
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: true

  # -----------------------------------------------------------------
  # 3. VictoriaLogs (Loki-compatible HTTP endpoint fallback)
  # -----------------------------------------------------------------
  - name: VictoriaLogs (Loki API)
    type: loki
    access: proxy
    url: http://victorialogs:9428/select/loki
    editable: true
