
services:
  # =================================================================
  # 1. Grafana - UI & Visualization
  # =================================================================
  grafana:
    image: ${GRAFANA_IMAGE:-ghcr.io/korjavin/monitoring-grafana-vendor:latest}
    container_name: ${GRAFANA_CONTAINER_NAME:-monitoring-grafana}
    restart: unless-stopped
    environment:
      # --- Server & Base URL ---
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

      # --- Official VictoriaLogs Datasource Plugin ---
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource

      # --- Pocket-ID (OIDC) Authentication ---
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GF_AUTH_GENERIC_OAUTH_ENABLED:-true}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GF_AUTH_GENERIC_OAUTH_NAME:-Pocket-ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${POCKET_ID_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${POCKET_ID_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${POCKET_ID_HOST}/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://${POCKET_ID_HOST}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://${POCKET_ID_HOST}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admin') && 'GrafanaAdmin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: ${GF_AUTH_DISABLE_LOGIN_FORM:-true}
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    networks:
      - internal
      - traefik_network
    depends_on:
      - victoriametrics
      - victorialogs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME:-traefik_default}"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # =================================================================
  # 2. VictoriaMetrics - Metrics Time Series Database
  # =================================================================
  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE:-ghcr.io/korjavin/monitoring-victoriametrics-vendor:latest}
    container_name: ${VICTORIAMETRICS_CONTAINER_NAME:-monitoring-victoriametrics}
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VM_RETENTION_PERIOD:-1y}"
      - "-httpListenAddr=:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    networks:
      - internal
      - traefik_network

  # =================================================================
  # 3. VictoriaLogs - High-Performance Log Database
  # =================================================================
  victorialogs:
    image: ${VICTORIALOGS_IMAGE:-ghcr.io/korjavin/monitoring-victorialogs-vendor:latest}
    container_name: ${VICTORIALOGS_CONTAINER_NAME:-monitoring-victorialogs}
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=${VLOGS_RETENTION_PERIOD:-30d}"
      - "-httpListenAddr=:9428"
    volumes:
      - vmlogs-data:/victoria-logs-data
    networks:
      - internal
      - traefik_network

  # =================================================================
  # 4. vmagent - Scrapes Metrics (Localhost, Containers, VM & VMLogs)
  # =================================================================
  vmagent:
    image: ${VMAGENT_IMAGE:-ghcr.io/korjavin/monitoring-vmagent-vendor:latest}
    container_name: ${VMAGENT_CONTAINER_NAME:-monitoring-vmagent}
    restart: unless-stopped
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-remoteWrite.url=http://victoriametrics:8428/api/v1/write"
      - "-promscrape.configCheckInterval=30s"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vmagent-data:/vmagentdata
    configs:
      - source: vmagent_scrape
        target: /etc/vmagent/scrape.yml
    networks:
      - internal
      - traefik_network
    depends_on:
      - victoriametrics

  # =================================================================
  # 5. Vector - Collects Logs from Docker & Portainer Containers
  # =================================================================
  vector:
    image: ${VECTOR_IMAGE:-ghcr.io/korjavin/monitoring-vector-vendor:latest}
    container_name: ${VECTOR_CONTAINER_NAME:-monitoring-vector}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml
    networks:
      - internal
    depends_on:
      - victorialogs

networks:
  internal:
    name: ${INTERNAL_NETWORK_NAME:-monitoring_internal}
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik_default}

volumes:
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME:-monitoring_grafana_data}
  vm-data:
    name: ${VM_DATA_VOLUME:-monitoring_vm_data}
  vmlogs-data:
    name: ${VMLOGS_DATA_VOLUME:-monitoring_vmlogs_data}
  vmagent-data:
    name: ${VMAGENT_DATA_VOLUME:-monitoring_vmagent_data}
  vector-data:
    name: ${VECTOR_DATA_VOLUME:-monitoring_vector_data}

# ponytail: inline configs, not ./config bind mounts — Portainer clones the repo inside its own
# container, so relative host paths don't exist and Docker mounts empty dirs instead.
configs:
  grafana_datasources:
    content: |
      apiVersion: 1

      datasources:
        # -----------------------------------------------------------------
        # 1. VictoriaMetrics (Prometheus-compatible)
        # -----------------------------------------------------------------
        - name: VictoriaMetrics
          type: prometheus
          access: proxy
          url: http://victoriametrics:8428
          isDefault: true
          jsonData:
            httpMethod: POST
            timeInterval: 15s
          editable: true

        # -----------------------------------------------------------------
        # 2. VictoriaLogs (Official victoriametrics-logs-datasource plugin)
        # -----------------------------------------------------------------
        - name: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victorialogs:9428
          editable: true

        # -----------------------------------------------------------------
        # 3. VictoriaLogs (Loki-compatible HTTP endpoint fallback)
        # -----------------------------------------------------------------
        - name: VictoriaLogs (Loki API)
          type: loki
          access: proxy
          url: http://victorialogs:9428/select/loki
          editable: true
  vmagent_scrape:
    content: |
      # =================================================================
      # vmagent Prometheus Scrape Configuration
      # =================================================================

      global:
        scrape_interval: 15s
        scrape_timeout: 10s

      scrape_configs:
        # ---------------------------------------------------------------
        # 1. VictoriaMetrics internal metrics
        # ---------------------------------------------------------------
        - job_name: "victoriametrics"
          static_configs:
            - targets: ["victoriametrics:8428"]
              labels:
                service: "victoriametrics"

        # ---------------------------------------------------------------
        # 2. VictoriaLogs internal metrics
        # ---------------------------------------------------------------
        - job_name: "victorialogs"
          static_configs:
            - targets: ["victorialogs:9428"]
              labels:
                service: "victorialogs"

        # ---------------------------------------------------------------
        # 3. vmagent internal metrics
        # ---------------------------------------------------------------
        - job_name: "vmagent"
          static_configs:
            - targets: ["localhost:8429"]
              labels:
                service: "vmagent"

        # ---------------------------------------------------------------
        # 4. Grafana internal metrics
        # ---------------------------------------------------------------
        - job_name: "grafana"
          static_configs:
            - targets: ["grafana:3000"]
              labels:
                service: "grafana"

        # ---------------------------------------------------------------
        # 5. Local Docker Container Service Discovery
        # Discovers any container on the host Docker daemon having:
        #   labels:
        #     - "prometheus.scrape=true"
        #     - "prometheus.port=9090"       # optional, default container port
        #     - "prometheus.path=/metrics"   # optional, default /metrics
        # ---------------------------------------------------------------
        - job_name: "docker-containers"
          docker_sd_configs:
            - host: "unix:///var/run/docker.sock"
          relabel_configs:
            # Only keep containers with prometheus.scrape=true
            - source_labels: [__meta_docker_container_label_prometheus_scrape]
              regex: "true"
              action: keep

            # Label container name without leading slash
            - source_labels: [__meta_docker_container_name]
              regex: "/(.*)"
              target_label: container_name
              replacement: "$${1}"

            # Allow custom metrics path
            - source_labels: [__meta_docker_container_label_prometheus_path]
              regex: "(.+)"
              target_label: __metrics_path__

            # Allow custom port override
            - source_labels: [__address__, __meta_docker_container_label_prometheus_port]
              regex: "([^:]+)(?::\\d+)?;(\\d+)"
              replacement: "$${1}:$${2}"
              target_label: __address__
  vector_config:
    content: |
      # =================================================================
      # Vector Configuration: Docker Container Logs -> VictoriaLogs
      # =================================================================

      data_dir: /var/lib/vector

      sources:
        # Ingest logs from all local Docker containers via the Docker socket
        docker_logs:
          type: docker_logs
          exclude_containers:
            # Exclude vector to avoid infinite log ingestion loop
            - monitoring-vector
            - vector

      transforms:
        enrich_docker_logs:
          type: remap
          inputs:
            - docker_logs
          source: |
            .host = get_hostname!()

            # Strip leading slash from Docker container names ("/portainer" -> "portainer")
            if exists(.container_name) {
              .container_name = replace(string!(.container_name), r'^/', "")
            }

      sinks:
        victorialogs:
          type: http
          inputs:
            - enrich_docker_logs
          uri: "http://victorialogs:9428/insert/jsonline?_stream_fields=host,container_name,stream&_msg_field=message&_time_field=timestamp"
          encoding:
            codec: json
          framing:
            method: newline_delimited
          request:
            concurrency: adaptive
            retry_attempts: 5
